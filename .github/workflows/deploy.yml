name: Solo-Resume-Project-Server-CI/CD

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Github Repository 파일 불러오기
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 의존성(라이브러리) 설치...
        run: yarn install --frozen-lockfile

      - name: .env 파일 만들기
        run: |
          echo '${{secrets.ENV}}' > .env

      - name: 압축하기
        run: tar -czvf project.tar.gz .env package.json yarn.lock src prisma

      # ✅ 기존 EC2와 새로운 EC2 모두에 파일 전송
      - name: SCP로 EC2 (기존 서버)에 빌드된 파일 전송하기
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }} # 기존 EC2
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: project.tar.gz
          target: /home/ubuntu/Solo-Resume-Project/tobe

      - name: SCP로 EC2 (새로운 서버)에 빌드된 파일 전송하기
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST_NEW }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: project.tar.gz
          target: /home/ubuntu/Solo-Resume-Project/tobe
          overwrite: true # ✅ 기존 파일이 있어도 덮어쓰기

      # ✅ 기존 EC2에서 서버 실행
      - name: SSH로 기존 EC2에 접속하여 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script_stop: true
          script: |
            rm -rf /home/ubuntu/Solo-Resume-Project/current
            mkdir /home/ubuntu/Solo-Resume-Project/current
            mv /home/ubuntu/Solo-Resume-Project/tobe/project.tar.gz /home/ubuntu/Solo-Resume-Project/current/project.tar.gz
            cd /home/ubuntu/Solo-Resume-Project/current
            tar -xvf project.tar.gz
            yarn install --frozen-lockfile
            yarn prisma generate  
            pm2 kill
            pm2 start src/app.js --name "backend-server"

      - name: SSH로 새로운 EC2에 접속하여 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_NEW }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e  # 스크립트 실행 중 오류 발생 시 즉시 종료
            echo "🚀 새로운 EC2 배포 시작"

            # 프로젝트 폴더 이동
            cd /home/ubuntu/Solo-Resume-Project

            # 기존 배포 폴더 삭제 후 새로 생성
            rm -rf /home/ubuntu/Solo-Resume-Project/current
            mkdir /home/ubuntu/Solo-Resume-Project/current
            mv /home/ubuntu/Solo-Resume-Project/tobe/project.tar.gz /home/ubuntu/Solo-Resume-Project/current/project.tar.gz

            # 새 배포 폴더로 이동 후 압축 해제
            cd /home/ubuntu/Solo-Resume-Project/current
            tar -xvf project.tar.gz

            # 패키지 설치
            yarn install --frozen-lockfile

            # Prisma 설정 (필요한 경우)
            yarn prisma generate

            # PM2가 설치되어 있는지 확인 후 설치
            if ! command -v pm2 &> /dev/null
            then
                echo "⚙️ PM2 설치 중..."
                npm install -g pm2
            fi

            # 기존 PM2 프로세스 삭제 (실패해도 무시)
            pm2 delete backend-server || true

            # PM2 실행 (ubuntu 계정에서 실행)
            echo "🔄 PM2 서버 실행 중..."
            pm2 start src/app.js --name "backend-server"

            # PM2가 SSH 세션 종료 후에도 실행되도록 설정
            pm2 save
            pm2 startup -u ubuntu --hp /home/ubuntu

            echo "✅ 배포 완료!"
