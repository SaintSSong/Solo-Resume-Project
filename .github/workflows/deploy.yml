name: Solo-Resume-Project-Server-CI/CD

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Github Repository 파일 불러오기
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 의존성(라이브러리) 설치...
        run: yarn install --frozen-lockfile

      - name: .env 파일 만들기
        run: |
          echo '${{secrets.ENV}}' > .env

      - name: 압축하기
        run: tar -czvf project.tar.gz .env package.json yarn.lock src prisma

      # ✅ 기존 EC2와 새로운 EC2 모두에 파일 전송
      - name: SCP로 EC2 (기존 서버)에 빌드된 파일 전송하기
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: project.tar.gz
          target: /home/ubuntu/Solo-Resume-Project/tobe
          overwrite: true # ✅ 기존 파일 덮어쓰기

      - name: SCP로 EC2 (새로운 서버)에 빌드된 파일 전송하기
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST_NEW }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: project.tar.gz
          target: /home/ubuntu/Solo-Resume-Project/tobe
          overwrite: true # ✅ 기존 파일 덮어쓰기

      # ✅ 기존 EC2에서 서버 실행
      - name: SSH로 기존 EC2에 접속하여 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e  # 오류 발생 시 즉시 종료
            echo "🚀 기존 EC2 배포 시작"

            # ✅ 기존 배포 폴더 삭제 및 재생성
            rm -rf /home/ubuntu/Solo-Resume-Project/current
            mkdir -p /home/ubuntu/Solo-Resume-Project/current

            # ✅ 배포 파일 존재 여부 확인
            if [ ! -f "/home/ubuntu/Solo-Resume-Project/tobe/project.tar.gz" ]; then
                echo "❌ project.tar.gz 파일이 없습니다. 배포를 중단합니다."
                exit 1
            fi

            mv /home/ubuntu/Solo-Resume-Project/tobe/project.tar.gz /home/ubuntu/Solo-Resume-Project/current/project.tar.gz

            # ✅ 압축 해제 및 검증
            cd /home/ubuntu/Solo-Resume-Project/current
            tar -xvf project.tar.gz
            ls -al

            # ✅ 패키지 설치
            yarn install --frozen-lockfile

            # ✅ Prisma 설정
            yarn prisma generate

            # ✅ 기존 프로세스 종료 (포트 점유 방지)
            echo "🔄 기존 프로세스 종료 중..."
            sudo kill -9 $(lsof -t -i:3000) || true

            # ✅ PM2 설치 확인 및 실행
            if ! command -v pm2 &> /dev/null
            then
                echo "⚙️ PM2 설치 중..."
                npm install -g pm2
            fi

            pm2 stop all || true
            pm2 delete all || true
            pm2 start src/app.js --name "backend-server"
            pm2 save
            pm2 startup -u ubuntu --hp /home/ubuntu

            echo "✅ 기존 EC2 배포 완료!"

      # ✅ 새로운 EC2에서도 동일한 작업 수행
      - name: SSH로 새로운 EC2에 접속하여 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_NEW }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e  # 오류 발생 시 즉시 종료
            echo "🚀 새로운 EC2 배포 시작"

            # ✅ 기존 배포 폴더 삭제 및 재생성
            rm -rf /home/ubuntu/Solo-Resume-Project/current
            mkdir -p /home/ubuntu/Solo-Resume-Project/current

            # ✅ 배포 파일 존재 여부 확인
            if [ ! -f "/home/ubuntu/Solo-Resume-Project/tobe/project.tar.gz" ]; then
                echo "❌ project.tar.gz 파일이 없습니다. 배포를 중단합니다."
                exit 1
            fi

            mv /home/ubuntu/Solo-Resume-Project/tobe/project.tar.gz /home/ubuntu/Solo-Resume-Project/current/project.tar.gz

            # ✅ 압축 해제 및 검증
            cd /home/ubuntu/Solo-Resume-Project/current
            tar -xvf project.tar.gz
            ls -al

            # ✅ 패키지 설치
            yarn install --frozen-lockfile

            # ✅ Prisma 설정
            yarn prisma generate

            # ✅ 기존 프로세스 종료 (포트 점유 방지)
            echo "🔄 기존 프로세스 종료 중..."
            sudo kill -9 $(lsof -t -i:3000) || true

            # ✅ PM2 설치 확인 및 실행
            if ! command -v pm2 &> /dev/null
            then
                echo "⚙️ PM2 설치 중..."
                npm install -g pm2
            fi

            pm2 stop all || true
            pm2 delete all || true
            pm2 start src/app.js --name "backend-server"
            pm2 save
            pm2 startup -u ubuntu --hp /home/ubuntu

            echo "✅ 새로운 EC2 배포 완료!"
